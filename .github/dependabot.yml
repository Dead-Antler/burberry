version: 2

updates:
  # npm dependencies (bun uses the same package.json/lockfile)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Radix UI components move in lockstep — one PR for all of them
      radix:
        patterns:
          - "@radix-ui/*"
          - "radix-ui"
      # Type definition packages are low-risk
      types:
        patterns:
          - "@types/*"
      # Tailwind ecosystem
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
      # Drizzle ORM + kit + SQLite driver
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
          - "@libsql/*"
      # DnD Kit
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      # React ecosystem
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-hook-form"
          - "@hookform/*"
      # Dev tooling
      dev-tooling:
        patterns:
          - "eslint"
          - "eslint-config-next"
          - "typescript"
          - "tsx"
          - "shadcn"
    # Only allow version updates from the npm registry
    registries: "*"

  # GitHub Actions — pin to major versions, update digests
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Dockerfile base image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
