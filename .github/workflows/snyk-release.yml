name: Snyk (release gate)

# Only runs on release tag pushes so we stay well under the Snyk free-tier
# scan quota. Per-PR scanning is handled by `security.yml` (bun audit) and
# `codeql.yml`. This workflow is purely a final gate before a version goes
# out, so a high-severity issue here should block the release rather than
# just inform.
#
# Requires the `SNYK_TOKEN` repository secret. If it is missing, the workflow
# skips silently rather than failing the release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SNYK_TOKEN not set — skipping Snyk release scan."
          fi

  snyk:
    needs: check-secret
    if: needs.check-secret.outputs.has-token == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Suppression for setup-bun's built-in cache documented in
      # .github/zizmor.yml under `cache-poisoning`.
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - run: bun install --frozen-lockfile
      - uses: snyk/actions/node@9cf6ca713d71123d2d229cc3d7f145b96ea3c518 # master (snyk does not tag releases)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --file=package.json --sarif-file-output=snyk.sarif
      - uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        if: always()
        with:
          sarif_file: snyk.sarif
          category: snyk
