name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint a GitHub App installation token so that PRs and pushes made by
      # this workflow trigger downstream `pull_request` / `push` workflows
      # (CI, CodeQL, Security). The default GITHUB_TOKEN is deliberately
      # excluded from triggering nested workflows, which leaves required
      # checks unreported and blocks release PRs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          # `client-id` supersedes the deprecated `app-id` input. Take the
          # value from the App's settings page (it looks like `Iv23li...`),
          # not the numeric App ID.
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          # Scope the token to only what release-please needs, rather than
          # inheriting every permission the App installation holds.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
