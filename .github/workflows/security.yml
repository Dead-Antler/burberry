name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly catch-all so vulnerabilities discovered in unchanged deps still
    # surface. Monday 04:00 UTC = quiet window globally.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `--prod` is not a bun audit flag (only --json, --audit-level, --ignore
      # exist) and was being silently ignored, so dev-only advisories were
      # failing the job. --audit-level=high is the real filter.
      #
      # Advisory for now, not a required check: the dev-tooling chain (eslint,
      # shadcn CLI) contributes ~37 high advisories that never ship in the
      # runtime artifact. Promote to required once that backlog is triaged.
      - name: Audit
        run: bun audit --audit-level=high

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      # Install via `go install` so we get Go module proxy + sumdb
      # verification automatically. Wrapper actions for actionlint have a
      # history of breaking due to transitive Node.js compatibility issues,
      # and piping the upstream install script into bash is avoidable here.
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: stable
      - name: Install actionlint
        # renovate: datasource=github-releases depName=rhysd/actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint
        run: actionlint -color

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run zizmor
        # renovate: datasource=pypi depName=zizmor
        run: uvx zizmor@1.29.0 --format sarif . > zizmor.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
