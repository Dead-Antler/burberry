name: PR Title

# `squash_merge_commit_title` is set to PR_TITLE, so the pull request title
# becomes the squash commit subject verbatim — and that subject is what
# release-please parses to decide the next version. A non-conforming title
# ("Fix the login bug") is not rejected anywhere; it simply yields no version
# bump and no changelog entry. This job turns that silent no-op into a
# blocking, visible failure.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    name: conventional commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Kept in step with changelog-sections in release-please-config.json.
          # Only feat, fix and breaking changes bump the version; the rest are
          # changelog-only, which is intentional.
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            refactor
            test
            build
            ci
            chore
            style
          # Subject casing and wording are deliberately not enforced.
          # release-please does not care, and rejecting "fix: URL parsing" over
          # a capital letter is friction without benefit. This job checks only
          # that the type prefix is present and valid.
